# Project-owned: builds and tests `rbit` and its add-ons on every host it
# supports, and attaches release binaries to version tags.
name: Platforms

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu }
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: macos-15-intel, target: x86_64-apple-darwin }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install --no-self-update
      - run: cargo test --locked
      - run: cargo build --locked --release
      - name: Attach the binary to the release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --generate-notes || true
          # `rbit` and the `msvc-4x` add-on, which the catalog fetches from here.
          for name in rbit rbit-msvc-4x; do
            exe=target/release/$name; [ -f "$exe.exe" ] && exe="$exe.exe"
            archive="$name-${GITHUB_REF_NAME}-${{ matrix.target }}.tar.gz"
            tar -czf "$archive" -C "$(dirname "$exe")" "$(basename "$exe")"
            gh release upload "$GITHUB_REF_NAME" "$archive" --clobber
          done
