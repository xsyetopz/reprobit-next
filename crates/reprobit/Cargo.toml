[package]
name = "reprobit"
version = "0.3.0"
description = "Rebuild old software byte for byte with its original compiler, and show why the result can be trusted."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "rbit"
path = "src/main.rs"

[features]
default = ["mcp"]
# The stdio MCP server (`rbit mcp`); the CLI and skill work without it.
mcp = []

[lints]
workspace = true

[dependencies]
anyhow.workspace = true
clap = { version = "4.6.10", features = ["derive"] }
flate2 = "1.1.11"
gimli = { version = "0.34.0", default-features = false, features = ["read", "std"] }
hex = "0.4.3"
iced-x86.workspace = true
lzma-rs = "0.3.0"
object.workspace = true
schemars = "1.2.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json.workspace = true
sha2 = "0.11.2"
tar = "0.4.46"
toml = "1.2.3"
toml_edit = "0.25.21"
zip = { version = "9.8.2", default-features = false, features = ["deflate-flate2"] }

[dev-dependencies]
object = { workspace = true, features = ["write"] }
tempfile.workspace = true
