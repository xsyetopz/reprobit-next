[package]
name = "reprobit-msvc-4x"
version = "0.1.0"
description = "A ReproBit add-on for MSVC 4.x objects: reorders, renames, and exchanges instructions in ways proved to keep their behaviour."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "rbit-msvc-4x"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
anyhow.workspace = true
iced-x86.workspace = true
serde_json.workspace = true

[dev-dependencies]
object = { workspace = true, features = ["write"] }
tempfile.workspace = true
