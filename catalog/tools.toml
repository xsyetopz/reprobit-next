#:schema ../schemas/catalog.schema.json
# The ReproBit tool catalog: every tool and compiler `rbit` can fetch, where
# from, and how each download is checked. Nothing here is committed to a
# project or bundled with ReproBit; `rbit tool install` downloads into the
# per-user tools directory (`rbit tool home`) and `rbit tool remove` deletes it.
#
# A fetch is one of `url` (+ `sha256`), `git` (+ `rev`), `oci`, `pypi`, or
# `npm`; `host` limits it to platforms such as `macos-aarch64`. Vendor
# compilers are fetched from the community archives that already host them;
# their licenses stay with their owners.

# --- Compilers -------------------------------------------------------------

[tools."msvc-4.2"]
kind = "compiler"
summary = "Microsoft Visual C++ 4.2 (1996), with the C2 fix byte-identical decompilations rely on"
version = "4.2"
homepage = "https://github.com/archaic-msvc/msvc420"
license = "proprietary"
tags = ["x86", "win32", "pc", "msvc"]
runs = "windows"
force-include = ["/FI{}"]
bin = { cl = "bin/CL.EXE", link = "bin/LINK.EXE", lib = "bin/LIB.EXE", rc = "bin/RC.EXE", cvtres = "bin/CVTRES.EXE", nmake = "bin/NMAKE.EXE" }

[tools."msvc-4.2".env]
PATH = '${TOOLCHAIN_ROOTED}\bin'
INCLUDE = '${TOOLCHAIN_ROOTED}\include;${TOOLCHAIN_ROOTED}\mfc\include'
LIB = '${TOOLCHAIN_ROOTED}\lib;${TOOLCHAIN_ROOTED}\mfc\lib'
LIBPATH = '${TOOLCHAIN_ROOTED}\lib;${TOOLCHAIN_ROOTED}\mfc\lib'
TMP = '${TEMP}'
TEMP = '${TEMP}'
WINEDLLOVERRIDES = "msvcrt40=n;msvcrt20=n"

[[tools."msvc-4.2".get]]
git = "https://github.com/archaic-msvc/msvc420.git"
rev = "b42c244f0a83ba15ba2ffb62b0dc240d7b2dea50"
pick = { bin = "", include = "", lib = "", "mfc/include" = "", "mfc/lib" = "" }

[[tools."msvc-4.2".get]]
git = "https://github.com/archaic-msvc/msvc500.git"
rev = "8abf95ce980161ad87b0b02402269cce76988953"
pick = { "redist/msvcrt40.dll" = "bin/MSVCRT40.dll", "redist/msvcrt20.dll" = "bin/msvcrt20.dll" }

# Two calls in C2 that make register allocation depend on host timing.
[[tools."msvc-4.2".patch]]
file = "bin/C2.EXE"
offset = 0x52F07
from = "e84fb3feff"
to = "9090909090"

[[tools."msvc-4.2".patch]]
file = "bin/C2.EXE"
offset = 0x74832
from = "e8249afcff"
to = "9090909090"

