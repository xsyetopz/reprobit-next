# --- Collections -------------------------------------------------------------

# Every compiler decomp.me serves, as tools named decompme/<platform>/<name>,
# such as decompme/ps2/ee-gcc2.95.3-136 or decompme/gc_wii/mwcc_247_92.
# The first install resolves the image digest; reprobit.lock pins it.
[collections.decompme]
summary = "Compilers packaged by decomp.me"
homepage = "https://github.com/decompme/decomp.me"
license = "per compiler; most are proprietary vendor toolchains"
oci = "ghcr.io/decompme/compilers/{platform}/{name}"
strip = "compilers/{platform}/{name}"
# Members mix Win32, Linux, and macOS builds, so the install reads them.
default-runs = "detect"
force-include = { win32 = ["/FI{}"], xbox360 = ["/FI{}"], gc_wii = ["-prefix", "{}"], nds_arm9 = ["-prefix", "{}"], psp = ["-prefix", "{}"], ps2 = ["-include", "{}"], n64 = ["-include", "{}"], ps1 = ["-include", "{}"], gba = ["-include", "{}"], saturn = ["-include", "{}"] }

