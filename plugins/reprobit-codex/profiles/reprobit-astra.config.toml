# Codex profile for a ReproBit lead on GPT-6.2 Astra, the most capable and most
# expensive model (four times Sol per token). Use it only for a session about
# functions Sol left stalled; every role without a model runs on Astra too.
# Copy to $CODEX_HOME (~/.codex) and start with `codex --profile reprobit-astra`.
model = "gpt-6.2-astra"
model_reasoning_effort = "high"

# Read-only reprobit tools run without asking; every other tool asks first, and a
# headless `codex exec` refuses it.
[mcp_servers.reprobit]
default_tools_approval_mode = "writes"
