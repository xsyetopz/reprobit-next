# Codex profile for a ReproBit lead on GPT-6 Luna, for plans without Sol and for
# long, high-volume matching campaigns. Copy to $CODEX_HOME (~/.codex) and start
# with `codex --profile reprobit-luna`. Luna is as good at high as at xhigh, and
# high spends less of the plan.
model = "gpt-6-luna"
model_reasoning_effort = "high"
